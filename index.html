<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OiapoqueSafe</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f8;
    color: #173b57;
}

header {
    background: white;
    padding: 20px 40px;
    border-bottom: 3px solid #21966b;
}

header h1 {
    margin: 0;
    color: #123b63;
}

header p {
    color: #21966b;
}

.menu {
    background: #123b63;
    padding: 15px 40px;
}

.menu button {
    background: none;
    border: none;
    color: white;
    font-weight: bold;
    font-size: 16px;
    margin-right: 25px;
    cursor: pointer;
}

.menu button:hover {
    color: #55d6a0;
}

main {
    padding: 40px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-top: 20px;
}

.numero {
    font-size: 32px;
    font-weight: bold;
    color: #21966b;
}

</style>

</head>

<body>

<header>

<h1>OiapoqueSafe</h1>

<p>Central de Segurança Inteligente</p>

</header>


<nav class="menu">

<button onclick="inicio()">
Início
</button>

<button onclick="cameras()">
Câmeras
</button>

</nav>


<main id="conteudo">

<h2>Painel de Monitoramento</h2>

<p>
Acompanhe as informações de segurança da cidade.
</p>

<div class="card">

<h3>Câmeras conectadas</h3>

<div class="numero">24</div>

</div>

</main>


<script>

function inicio() {

document.getElementById("conteudo").innerHTML = `

<h2>Painel de Monitoramento</h2>

<p>
Acompanhe as informações de segurança da cidade.
</p>

<div class="card">

<h3>Câmeras conectadas</h3>

<div class="numero">24</div>

</div>

`;

}


function cameras() {

document.getElementById("conteudo").innerHTML = `

<h2>📹 Monitoramento de Câmeras</h2>

<p>
Câmeras conectadas à Central OiapoqueSafe.
</p>

<div class="card">

<h3>Câmera 01</h3>

<p>🟢 Online</p>

<p>Localização: Centro</p>

</div>

<div class="card">

<h3>Câmera 02</h3>

<p>🟢 Online</p>

<p>Localização: Avenida Principal</p>

</div>

`;

}

</script>


</body>

</html>
