<!DOCTYPE html> 
<html lang="pt-BR"> 

<head> 

    <meta charset="UTF-8"> 

    <meta name="viewport" content="width=device-width, inital-scale=1.0"> 

    <title>OiapoqueSafe</title>

    <style> 

        body { 
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            color: #173b57;
        } 

        header h1 { 
            background: white;
            padding: 20px 40px; 
            border-bottom: 3px splid #21966b;
        } 

        header h1 { 
            margin: 0;
            color: #123b63;
        } 

        header p { 
            margin: 5px 0 0;
            color: #21966b; 
        } 

        .menu { 
            background: #123b63;
            padding: 15px 40px; 
        } 

        .menu a { 
            color: white;
            text-decoration: none;
            margin-right: 30px;
            font-weight: bold;
        } 

        main { 
            padding: 40px;
        } 

        .titulo { 
            margin-bottom: 30px;
        } 

        .cards { 
            dispaly: flex;
            gap: 20px;
            flex-wrap: wrap;
        } 

        .card { 
            background: white;
            width: 200px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px;
#00000015;
        }

        .card h3 { 
            margin-top: 0;
            color: #123b63;
        } 

        .numero { 
            font-size: 32px;
            font-weight: bold;
            color: #21966b;
        } 

    </style> 

</head> 

<body> 

    <header> 

        <h1>OiapoqueSafe</h1>
        
        <p>Central de Segurança Inteligente</p> 

    </header> 


    <nav class="menu"> 

        <a href="#">Início</a> 

        <a href="#">Câmeras</a>

        <a href="#">Mapa</a>

        <a href="#">Ocorrências</a> 

        <a href="#">Relatórios</a>

    </nav> 


    <main> 

        <div class="titulo">

            <h2>Painel de Monitoramento</h2>

            <p> 
                Acompanhe as informações de segurança da cidade. 
            </p> 

        </div> 


        <div class="cards"> 

            <div class="card"> 

                <h3>Câmeras</h3>

                <div class="numero">24</div> 

                <p>Câmeras conectadas</p> 

            </div> 


            <div class="card"> 

                <h3>Ativas</h3>

                <div class="numero">21</div> 

                <p>Câmeras funcionando</p> 

            </div> 


            <div class="card"> 

                <h3>Ocorrências</h3>

                <div class="numero">03</div> 

                <p>Registradas hoje</p>

            </div> 

            <div class="card"> 

                <h3>Status</h3>

                <div class="numero">OK</div>

                <p>Sistema operacional</p>

            </div>

        </div>

    </main>

</body>

</html>
